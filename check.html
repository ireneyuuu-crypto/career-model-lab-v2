<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Model Lab · 部署自检</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:850px;margin:5vh auto;padding:24px;color:#473e57;background:#fcf9fd}h1{font-size:1.7rem}button{border:0;background:#625477;color:#fff;border-radius:12px;padding:12px 20px;cursor:pointer}li{padding:8px 0;border-bottom:1px solid #e9e2ed}pre{white-space:pre-wrap;word-break:break-word}small{color:#81758f}a{color:#665180}</style></head><body><h1>Career Model Lab · 部署自检</h1><p>检测 GitHub Pages 同一目录中的所有网页模块、星历数据和封面插画。<strong>所有项目文件必须直接位于发布目录根层，不要多套一层文件夹。</strong></p><button id="run">开始检查</button><p id="status">尚未开始</p><ol id="results"></ol><p><a href="./index.html">返回首页</a></p><script type="module">
const names=['index.html','app.js','engine.js','career-v2-canonical.js','career-features.js','career-index.js','career-story.js','outcome.js','year-details.js','interpretation.js','calibration.js','tarot.js','tarot-ui.js','landing.js','sample.html','sample.js','styles.css','sample.css','celestial-people.webp','ephemeris.json'];
const run=async()=>{const list=document.getElementById('results'),status=document.getElementById('status');list.replaceChildren();status.textContent='正在逐个检查文件…';let fails=0;for(const name of names){let result='';try{const r=await fetch('./'+name+'?diagnostic='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const type=r.headers.get('content-type')||'';if(name.endsWith('.js')&&type.includes('text/html'))throw Error('JS请求返回HTML：可能是文件不存在或部署目录错误');if(name==='ephemeris.json'){const data=await r.json();if(!Array.isArray(data['2027']))throw Error('数据不包含2027年');}else if(name.endsWith('.js')){const text=await r.text();if(!text.trim())throw Error('空模块文件');}result='✅ ';}catch(e){fails++;result='❌ ';const li=document.createElement('li');li.textContent=result+name+' — '+e.message;list.append(li);continue;}const li=document.createElement('li');li.textContent=result+name;list.append(li);}status.textContent=fails?'检查结束：'+fails+' 个文件有问题，请重传完整项目包。':'全部 '+names.length+' 个关键文件可访问。请回首页强制刷新重试。';};
document.getElementById('run').addEventListener('click',run);run();
</script><small>自检仅检查文件可访问与基本格式，不代表完成全部浏览器功能验收。若检测通过但仍报错，请查看浏览器控制台中的具体模块错误。</small></body></html>
