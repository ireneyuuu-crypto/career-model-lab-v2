<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Model Lab · 数据自检</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:8vh auto;padding:24px;color:#655a54;background:#fffdfb}button{border:0;background:#7b6e66;color:white;border-radius:18px;padding:12px 22px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f8f5f2;padding:24px;border-radius:14px;line-height:1.8}</style><h1>星历数据自检</h1><p>检查 V1.2 合并后的数据文件是否成功部署。</p><button id="run">运行检测</button><pre id="status">尚未检测</pre><script type="module">document.querySelector('#run').onclick=async()=>{let o=document.querySelector('#status');o.textContent='检查中…';try{const r=await fetch('./ephemeris.json');if(!r.ok)throw Error('HTTP '+r.status+'：无法读取 ephemeris.json');const d=await r.json();const years=Object.keys(d);o.textContent='✅ 文件读取成功\n覆盖年份：'+years[0]+'–'+years.at(-1)+'\n年份数量：'+years.length+'\n1992：'+(Array.isArray(d['1992'])?'有':'缺失')+'\n2027：'+(Array.isArray(d['2027'])?'有':'缺失')+'\n\n可以返回首页测试分析。';}catch(e){o.textContent='❌ '+e.message+'\n请确认 ephemeris.json 与 index.html 位于仓库根目录且 Pages 完成部署。';}};</script></html>
